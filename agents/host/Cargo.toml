[package]
name = "bipremote-host"
version = "0.1.0"
description = "BIPRemote Windows host agent foundation"
edition = "2024"

[workspace]
members = ["service"]
resolver = "3"

[dependencies]
ed25519 = "2.1"
curve25519-dalek = "2.0"
sha2 = "0.10"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"
rand = "0.8"
parking_lot = "0.12"
futures = "0.3"