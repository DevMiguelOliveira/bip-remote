[package]
name = "bipremote-host-service"
version = "0.1.0"
description = "BIPRemote privileged service foundation"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hyper = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
sha2 = "0.10"
ed25519 = "2.1"
curve25519-dalek = "2.0"
parking_lot = "0.12"
rand = "0.8"