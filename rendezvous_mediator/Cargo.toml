[package]
name = "bipremote-mediator"
version = "0.1.0"
description = "BIPRemote rendezvous mediator service for P2P connection coordination"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.0"
hyper = { version = "1.0", features = ["full"] }
thiserror = "1.0"