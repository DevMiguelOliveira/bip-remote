services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bipremote
      POSTGRES_USER: bipremote
      POSTGRES_PASSWORD: bipremote
    ports:
      - "5432:5432"
    volumes:
      - bipremote-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bipremote -d bipremote"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bipremote-postgres:
